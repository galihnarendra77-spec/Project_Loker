<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User/Admin Selection (Animated)</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Custom Tailwind Config -->
  <script src="config.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="font-display">
  <div
    class="relative flex h-auto min-h-screen w-full flex-col items-center justify-between bg-background-light p-4 text-[#111814] dark:bg-background-dark dark:text-gray-200">

    <div class="flex w-full flex-1 flex-col items-center justify-center">
      <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="mb-8 flex justify-center">
          <div class="flex h-20 w-20 items-center justify-center rounded-2xl bg-primary/20">
            <span class="material-symbols-outlined text-4xl text-primary">apps</span>
          </div>
        </div>

        <!-- Judul -->
        <h1
          class="animate-fade-in text-[#111814] dark:text-white tracking-tight text-[32px] font-bold leading-tight px-4 text-center pb-3 pt-6">
          Selamat Datang
        </h1>

        <p class="text-[#111814] dark:text-gray-300 text-base font-normal leading-normal pb-3 pt-1 px-4 text-center">
          Masuk sebagai:
        </p>

        <div class="h-5"></div>

        <!-- Tombol -->
        <div class="flex justify-center">
          <div class="flex flex-1 gap-4 max-w-[480px] flex-col items-stretch px-4 py-3">

            <button class="btn-primary">
              <span class="material-symbols-outlined">person</span>
              <span class="truncate">Pengguna</span>
            </button>

            <button class="btn-secondary">
              <span class="material-symbols-outlined">shield_person</span>
              <span class="truncate">Admin</span>
            </button>

          </div>
        </div>

      </div>
    </div>

    <div class="w-full max-w-md pb-4">
      <p class="text-[#618972] dark:text-primary/70 text-sm font-normal leading-normal pb-3 pt-1 px-4 text-center underline cursor-pointer">
        Butuh Bantuan?
      </p>
    </div>

  </div>

  <!-- Custom JS -->
  <script src="script.js"></script>
</body>

</html>
